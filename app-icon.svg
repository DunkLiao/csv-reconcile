<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="108" fill="url(#bg)" />
  <!-- Spreadsheets / Comparison graphic -->
  <g fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- Table Sheet -->
    <rect x="100" y="100" width="312" height="312" rx="28" fill="#FFFFFF" fill-opacity="0.12" />
    <!-- Horizontal lines -->
    <line x1="100" y1="180" x2="412" y2="180" />
    <line x1="100" y1="260" x2="412" y2="260" />
    <line x1="100" y1="340" x2="412" y2="340" />
    <!-- Vertical lines -->
    <line x1="200" y1="100" x2="200" y2="412" />
    <line x1="310" y1="100" x2="310" y2="412" />
  </g>
  <!-- Checkmark badge in bottom right -->
  <circle cx="390" cy="390" r="76" fill="#10B981" stroke="#FFFFFF" stroke-width="16" />
  <path d="M356 390 L380 414 L426 368" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
</svg>
