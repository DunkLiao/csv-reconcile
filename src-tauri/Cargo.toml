[package]
name = "csv-reconcile"
version = "1.0.0"
description = "CSV Compare Desktop Tool"
authors = ["CSV Compare"]
edition = "2021"

[lib]
name = "csv_reconcile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-dialog = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
encoding_rs = "0.8"
chardetng = "0.1"
rust_xlsxwriter = "0.79"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
